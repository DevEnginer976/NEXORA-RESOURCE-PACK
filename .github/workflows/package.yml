name: Build NEXORA 1.12.2 Resource Pack

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image generator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate all pack assets
        run: |
          python scripts/generate_textures.py
          python scripts/generate_ui.py
      - name: Validate generated PNG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = list(Path("assets").rglob("*.png"))
          assert len(files) >= 40, f"Expected at least 40 PNG files, got {len(files)}"
          for path in files:
              with Image.open(path) as im:
                  im.verify()
          print(f"Validated {len(files)} PNG files")
          PY
      - name: Save generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate optimized NEXORA resource pack assets"
            git push
          fi
      - name: Build installable ZIP
        run: |
          mkdir -p dist
          cd assets
          zip -qr ../dist/NEXORA-HYPERMC-RPG-1.12.2.zip .
          cd ..
          cp pack.mcmeta dist/
          cd dist
          zip -q NEXORA-HYPERMC-RPG-1.12.2.zip pack.mcmeta
          unzip -t NEXORA-HYPERMC-RPG-1.12.2.zip
          unzip -l NEXORA-HYPERMC-RPG-1.12.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-HYPERMC-RPG-1.12.2
          path: dist/NEXORA-HYPERMC-RPG-1.12.2.zip
          if-no-files-found: error
          retention-days: 30
