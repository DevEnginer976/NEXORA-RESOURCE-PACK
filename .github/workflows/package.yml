name: Package NEXORA Resource Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate original pixel-art textures
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_textures.py
      - name: Save generated textures to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nexora/textures
          if ! git diff --cached --quiet; then
            git commit -m "Generate distinct NEXORA pixel-art item textures"
            git push
          fi
      - name: Build installable resource pack ZIP
        run: |
          mkdir -p dist
          zip -r dist/NEXORA-HYPERMC-RPG-1.12.2.zip assets pack.mcmeta
          unzip -t dist/NEXORA-HYPERMC-RPG-1.12.2.zip
          unzip -l dist/NEXORA-HYPERMC-RPG-1.12.2.zip
      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-HYPERMC-RPG-1.12.2
          path: dist/NEXORA-HYPERMC-RPG-1.12.2.zip
          if-no-files-found: error
          retention-days: 30
