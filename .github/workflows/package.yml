name: Build NEXORA 1.12.2 Resource Pack

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image generator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate all pack assets
        run: |
          python scripts/generate_textures.py
          python scripts/generate_ui.py
      - name: Validate generated PNG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = list(Path("assets").rglob("*.png"))
          assert len(files) >= 40, f"Expected at least 40 PNG files, got {len(files)}"
          for path in files:
              with Image.open(path) as im:
                  im.verify()
          print(f"Validated {len(files)} PNG files")
          import json, hashlib
          arsenal_png = sorted(Path("assets/nexora/textures/items/arsenal").glob("*.png"))
          arsenal_models = sorted(Path("assets/nexora/models/item").glob("arsenal_*.json"))
          assert len(arsenal_png) == 50, f"Expected 50 arsenal textures, got {len(arsenal_png)}"
          assert len(arsenal_models) == 50, f"Expected 50 arsenal models, got {len(arsenal_models)}"
          hashes = set()
          for path in arsenal_png:
              hashes.add(hashlib.sha256(path.read_bytes()).hexdigest())
          assert len(hashes) == 50, "Arsenal contains duplicate texture files"
          for path in Path("assets").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          # Check every NEXORA model reference and every NEXORA texture reference.
          for base_model in Path("assets/minecraft/models/item").glob("*.json"):
              model_data = json.loads(base_model.read_text(encoding="utf-8"))
              for override in model_data.get("overrides", []):
                  model_ref = override.get("model", "")
                  if model_ref.startswith("nexora:"):
                      model_path = Path("assets/nexora/models") / (model_ref.split(":", 1)[1] + ".json")
                      assert model_path.exists(), f"Missing model referenced by {base_model}: {model_path}"
          for model_path in Path("assets/nexora/models/item").glob("*.json"):
              model_data = json.loads(model_path.read_text(encoding="utf-8"))
              for texture_ref in model_data.get("textures", {}).values():
                  if texture_ref.startswith("nexora:"):
                      texture_path = Path("assets/nexora/textures") / (texture_ref.split(":", 1)[1] + ".png")
                      assert texture_path.exists(), f"Missing texture referenced by {model_path}: {texture_path}"
          print("Validated 50 unique arsenal textures, 50 model definitions, all JSON and model/texture references")
          PY
      - name: Save generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate optimized NEXORA resource pack assets"
            git push
          fi
      - name: Build installable ZIP
        run: |
          mkdir -p dist
          cd assets
          zip -qr ../dist/NEXORA-HYPERMC-RPG-1.12.2.zip .
          cd ..
          cp pack.mcmeta dist/
          cd dist
          zip -q NEXORA-HYPERMC-RPG-1.12.2.zip pack.mcmeta
          unzip -t NEXORA-HYPERMC-RPG-1.12.2.zip
          unzip -l NEXORA-HYPERMC-RPG-1.12.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-HYPERMC-RPG-1.12.2
          path: dist/NEXORA-HYPERMC-RPG-1.12.2.zip
          if-no-files-found: error
          retention-days: 30
