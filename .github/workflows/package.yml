name: Package NEXORA Resource Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          mkdir -p dist
          cd assets
          zip -r ../dist/NEXORA-HYPERMC-RPG-1.12.2.zip .
          cd ..
          cp pack.mcmeta dist/pack.mcmeta
          cp pack.png dist/pack.png 2>/dev/null || true
      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-HYPERMC-RPG-1.12.2
          path: dist/
          if-no-files-found: error
          retention-days: 30
